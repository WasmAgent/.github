name: External Outbound Preflight

# Technical preflight gate for substantive external messages (package/version
# announcements, install/run commands handed to external users, CI/conformance/
# provenance status claims, corrections). This workflow can only ever produce
# a technical verdict (TECHNICALLY_READY) or HOLD; it can never post anything
# externally.
#
# Required-check architecture (mirrors org-compat.yml, N3-P1-03) with two
# hardenings on top:
#
# 1. Trust-boundary split: the authority job validates the claim ledgers in a
#    pristine workspace BEFORE anything external executes, and the replay job
#    (which installs and runs record-named packages) is chained after it. The
#    validator additionally snapshots the ledger files before replay and
#    fails closed if an executed bin mutates them — no TOCTOU from external
#    code back into the audited trust authority.
# 2. Trusted relevance: the summary job recomputes relevance from the
#    detector loaded from origin/main (never the candidate tree) over the
#    objective git diff file list, and the pinned immutable evaluator
#    consumes only that recomputation.
#
# All checkouts run with persist-credentials: false.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect outbound-sensitive changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
          if git diff --name-only "$base"...HEAD | grep -qE '^(evidence/external-outbound/|schemas/external-outbound-preflight\.schema\.json|scripts/external-outbound-preflight|scripts/external-outbound/|scripts/verify-external-outbound-preflight\.mjs|\.github/workflows/external-outbound-preflight\.yml|claims/public-claims\.yml|claims/claim-overreach-allowlist\.json|evidence/external-validation\.json|scripts/validate-public-claims\.py|scripts/validate-external-evidence\.py)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # Authority validation FIRST, in a pristine workspace: the claim ledgers
  # are validated before any record-named external package is installed or
  # executed anywhere in this workflow.
  outbound-authority:
    name: Outbound authority (claim ledgers, pristine workspace)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Same trust anchor as the required claims check: validators from an
      # immutable main revision inspect candidate DATA.
      - name: Checkout pinned trusted validators
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: WasmAgent/.github
          ref: 4a5a9126eadd8a9961b5b200f6e146f9d091ad0e
          path: .validator
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: External evidence ledger (EXT-01..07)
        run: python .validator/scripts/validate-external-evidence.py --repo-root .
      - name: Public claims firewall
        run: python .validator/scripts/validate-public-claims.py --repo-root .

  # Replay job: installs and RUNS record-named external packages. Chained
  # after the authority job; it never re-validates the ledgers afterwards —
  # the validator snapshots them before replay and fails closed on mutation.
  outbound-preflight:
    name: Outbound preflight (live primary-source verification)
    needs: [changes, outbound-authority]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      # Hostile regressions ER-01..ER-07 (hermetic — no registry access).
      - name: Hostile regressions (ER-01..ER-07)
        run: node --test scripts/external-outbound-preflight.test.mjs

      # Live verification of every record against real primary sources:
      # registry metadata, clean-install of the PUBLISHED artifact (secrets
      # scrubbed, --ignore-scripts / wheel-only, bin allowlist), exact command
      # replay with semantic source binding, ledger mutation guard, final
      # GitHub state, claim_refs.
      - name: Verify outbound records against primary sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-external-outbound-preflight.mjs

  outbound-preflight-summary:
    name: External outbound preflight (.github)
    needs: [changes, outbound-preflight]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Candidate tree: only used to compute the OBJECTIVE changed-file list.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      # Default-branch-owned detector: loaded from origin/main, never from the
      # candidate tree, so a candidate cannot weaken relevance.
      - name: Checkout relevance detector from default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: .gate
          persist-credentials: false

      - name: Recompute relevance from the default-branch-owned detector
        id: relevance
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin main >/dev/null 2>&1 || true
          git diff --name-only "origin/main...HEAD" > /tmp/changed-files.txt
          # Trust anchor: the detector comes from origin/main. The candidate
          # copy is used ONLY until this script first lands on main
          # (bootstrap of the gate itself) and is loudly annotated.
          DETECTOR=".gate/scripts/external-outbound/relevance.mjs"
          if [ ! -f "$DETECTOR" ]; then
            echo "::warning::default-branch detector not present yet (gate bootstrap) — falling back to the candidate copy; after this change merges, origin/main is the trust anchor"
            DETECTOR="scripts/external-outbound/relevance.mjs"
            [ -f "$DETECTOR" ] || { echo "no relevance detector available"; exit 1; }
          fi
          node "$DETECTOR" --files /tmp/changed-files.txt | tee /tmp/relevance.txt
          grep -q '^relevant=' /tmp/relevance.txt
          value=$(sed -n 's/^relevant=//p' /tmp/relevance.txt)
          echo "relevant=$value" >> "$GITHUB_OUTPUT"

      # The evaluator is loaded from the immutable org-gate revision, never
      # from the candidate tree; its relevance input is the default-branch
      # detector's recomputation, not the candidate's changes job.
      - name: Checkout org gate evaluator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: WasmAgent/.github
          ref: ca2067cda59a58dc67a824ff6e4a0c58c5addf95
          path: .org
          persist-credentials: false
      - name: Evaluate preflight result (fail closed)
        run: |
          set -euo pipefail
          node .org/scripts/org-contract/required-result.mjs \
            --changes-result "${{ needs.changes.result }}" \
            --relevant "${{ steps.relevance.outputs.relevant }}" \
            --inner-name "outbound-preflight" \
            --inner-result "${{ needs.outbound-preflight.result }}"
