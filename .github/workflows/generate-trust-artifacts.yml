# Generate Trust Artifacts (SCAFFOLD — NOT FOR RELEASE PUBLICATION)
#
# This workflow is a manual scaffold only. It generates placeholder trust
# artifacts for local development and CI inspection. It does NOT upload to
# GitHub releases and MUST NOT be triggered on release events until real
# generators are implemented (see wasmagent-ops/generators/).
#
# Placeholder artifacts are labeled UNVERIFIED-SCAFFOLD and must never be
# presented as verified trust evidence.

name: Generate Trust Artifacts (SCAFFOLD)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to generate scaffold artifacts for'
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate-trust-artifacts:
    name: Generate Trust Artifacts (UNVERIFIED-SCAFFOLD)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Get release information
        id: release_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event.inputs.release_tag }}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate AgentBOM (UNVERIFIED-SCAFFOLD)
        id: agentbom
        env:
          TAG_NAME: ${{ steps.release_info.outputs.tag_name }}
        run: |
          # PLACEHOLDER — not a real AgentBOM generator.
          cat << 'HEREDOC' > "agentbom-${TAG_NAME}.json"
          {
            "_warning": "UNVERIFIED-SCAFFOLD — placeholder, not verified trust evidence",
            "bomFormat": "AgentBOM",
            "specVersion": "1.0",
            "metadata": {
              "generated": "placeholder",
              "generator": "scaffold (pending implementation)"
            },
            "components": []
          }
          HEREDOC
          echo "agentbom_file=agentbom-${TAG_NAME}.json" >> "$GITHUB_OUTPUT"

      - name: Generate MCP Posture (UNVERIFIED-SCAFFOLD)
        id: mcp_posture
        env:
          TAG_NAME: ${{ steps.release_info.outputs.tag_name }}
        run: |
          cat << 'HEREDOC' > "mcp-posture-${TAG_NAME}.json"
          {
            "_warning": "UNVERIFIED-SCAFFOLD — placeholder, not verified trust evidence",
            "postureFormat": "MCPPosture",
            "specVersion": "1.0",
            "metadata": {
              "generated": "placeholder",
              "generator": "scaffold (pending implementation)"
            },
            "declaredServers": [],
            "declaredTools": [],
            "capabilities": {}
          }
          HEREDOC
          echo "mcp_posture_file=mcp-posture-${TAG_NAME}.json" >> "$GITHUB_OUTPUT"

      - name: Generate Trust Passport (UNVERIFIED-SCAFFOLD)
        id: trust_passport
        env:
          TAG_NAME: ${{ steps.release_info.outputs.tag_name }}
        run: |
          cat << 'HEREDOC' > "trust-passport-${TAG_NAME}.json"
          {
            "_warning": "UNVERIFIED-SCAFFOLD — placeholder, not verified trust evidence",
            "passportFormat": "TrustPassport",
            "specVersion": "1.0",
            "metadata": {
              "generated": "placeholder",
              "generator": "scaffold (pending implementation)"
            },
            "identity": {},
            "posture": {},
            "evidence": []
          }
          HEREDOC
          echo "trust_passport_file=trust-passport-${TAG_NAME}.json" >> "$GITHUB_OUTPUT"

      - name: Upload scaffold artifacts (ephemeral Actions artifacts, NOT releases)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UNVERIFIED-SCAFFOLD-trust-artifacts
          path: |
            agentbom-*.json
            mcp-posture-*.json
            trust-passport-*.json
          retention-days: 7

      - name: Summary
        run: |
          echo "## Trust Artifacts (UNVERIFIED-SCAFFOLD)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️ These are **placeholder scaffold artifacts**, not verified trust evidence." >> "$GITHUB_STEP_SUMMARY"
          echo "They are NOT uploaded to GitHub releases." >> "$GITHUB_STEP_SUMMARY"
