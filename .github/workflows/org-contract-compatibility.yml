name: Org Contract Compatibility

# Org Gates O1-O4 (see policies/repository-assurance.yml and the non-core
# alignment repair plan). Replaces the former STUB-only checks.
#
# O1 — repository assurance: every non-core repo satisfies the supply-chain
#      baseline (immutable action refs, permissions, lockfiles, no @latest).
# O2a — canonical contract integrity: canonical fixtures from the pinned
#       @wasmagent/protocol package validate; semantic-negatives fail; vendored
#       schemas are byte-identical; the org stack lock is internally consistent.
# O2b — consumer compatibility: each consumer repo's own real entry point runs
#       at its exact pinned SHA against the pinned canonical package versions.
# O3 — Golden Path (application/package integration): the runnable reference app
#      passes its exact-stack vectors at the revision pinned in the org stack
#      lock. Scope is the JS/OAA integration path on top of the certified core
#      baseline — it does not invoke the proxy native Rust verifier or the
#      trace-pipeline runtime (see golden-path/README.md, N2-P2-01).
# O4 — release workflow provenance policy: structured YAML DAG validation of
#      the release/deploy workflows (no substring checks). Static evidence is
#      reported as release_workflow_static_policy; runtime release_provenance
#      requires a relayed provenance artifact (see provenance.schema.json).
#
# Every gate resolves the revision it tests from golden-path/versions.lock.json
# via scripts/org-contract/checkout-pinned.sh, checks out that exact SHA and
# asserts HEAD == pin. No stack attestation gate may use an implicit main.
#
# A final attestation job (v2) binds every pinned repo SHA, its committed lock
# hash and the gates exercised, and fails when a gate-consumed repo is not
# pinned.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "policies/**"
      - "scripts/**"
      - "golden-path/versions.lock.json"
      - "attestations/**"
      - ".github/workflows/org-contract-compatibility.yml"

permissions:
  contents: read

env:
  PROTOCOL_PKG: "@wasmagent/protocol@0.1.10"

jobs:
  o0-script-tests:
    name: "O0: gate script unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      # Gate scripts use the `yaml` parser via createRequire; install it where
      # NODE_PATH can find it (npm install is allowlisted for this workflow).
      - name: Install gate script dependencies
        run: |
          mkdir -p /tmp/gate-deps && cd /tmp/gate-deps
          npm init -y >/dev/null
          npm install --no-audit --no-fund yaml@2
      - name: Run org-contract script tests
        env:
          NODE_PATH: /tmp/gate-deps/node_modules
        run: node --test scripts/org-contract/*.test.mjs

  o1-repository-assurance:
    name: "O1: repository assurance"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Include this repository in the scan set
        run: |
          mkdir -p scan
          rsync -a --exclude scan "$GITHUB_WORKSPACE/" scan/.github/

      - name: Clone non-core repositories at their pinned SHAs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for repo in $(node scripts/org-contract/stack-lock.mjs --repos); do
            scripts/org-contract/checkout-pinned.sh "$repo" "scan/${repo}"
          done

      - name: Run assurance scanner
        run: python3 scripts/check-repository-assurance.py --root scan

  o2a-canonical-contract:
    name: "O2a: canonical contract integrity"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install canonical protocol package + validator
        run: |
          mkdir -p /tmp/contract-gate && cd /tmp/contract-gate
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$PROTOCOL_PKG" ajv@8 ajv-formats@3

      # ORG-CD-03 / ORG-CD-04: canonical valid fixtures PASS, semantic-invalid
      # fixtures FAIL. Nothing may silently normalize invalid to valid.
      - name: Validate canonical fixtures against canonical schemas
        run: |
          cd /tmp/contract-gate
          node "$GITHUB_WORKSPACE/scripts/org-contract/validate-fixtures.mjs"

      # ORG-CD-01: vendored schema bytes must equal the canonical package bytes,
      # at the exact symkernel revision pinned in the org stack lock.
      - name: symkernel vendored schema drift gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/org-contract/checkout-pinned.sh symkernel /tmp/symkernel
          make -C /tmp/symkernel check-schemas

      # versions.lock.json must carry the certified tuple exactly, pin every
      # gated non-core repo, and resolve every pinned package on the registry.
      - name: Org stack lock consistency
        run: node scripts/org-contract/check-stack-lock.mjs

  o2b-consumer-compatibility:
    name: "O2b: consumer compatibility"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      # Execute each consumer's own real entry point at its pinned SHA. The
      # central gate never reimplements consumer logic — it runs the repo's
      # build/install/test, and asserts the canonical package versions resolve
      # to the versions pinned in the org stack lock.
      - name: Execute pinned consumer entry points
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t lines < <(node scripts/org-contract/consumers.mjs --tsv)
          for line in "${lines[@]}"; do
            IFS=$'\t' read -r repo build install command packages <<< "$line"
            echo "::group::${repo} pinned consumer"
            scripts/org-contract/checkout-pinned.sh "$repo" "/tmp/consumers/${repo}"
            cd "/tmp/consumers/${repo}"
            if [ -n "$build" ]; then eval "$build"; fi
            eval "$install"
            if [ -n "$packages" ]; then
              IFS=',' read -ra pkgs <<< "$packages"
              for pkg in "${pkgs[@]}"; do
                actual="$(node -e "console.log(require('./node_modules/${pkg}/package.json').version)")"
                expected="$(node -e "console.log(require('${GITHUB_WORKSPACE}/golden-path/versions.lock.json').packages['${pkg}'])")"
                if [ "$actual" != "$expected" ]; then
                  echo "FAIL ${repo}: ${pkg} resolved ${actual}, lock pins ${expected}" >&2
                  exit 1
                fi
                echo "OK ${repo}: ${pkg}@${actual}"
              done
            fi
            eval "$command"
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

  o3-golden-path-e2e:
    name: "O3: Golden Path E2E (exact stack)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Run certified-stack E2E in agent-golden-path at its pinned SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/org-contract/checkout-pinned.sh agent-golden-path /tmp/agent-golden-path
          cd /tmp/agent-golden-path
          bun install --frozen-lockfile
          bun run test:e2e:certified

  o4-release-provenance:
    name: "O4: release provenance"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Clone publishing/deploying repositories at their pinned SHAs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for repo in open-agent-audit agentbom bscode; do
            scripts/org-contract/checkout-pinned.sh "$repo" "scan/${repo}"
          done

      - name: Install gate script dependencies
        run: |
          mkdir -p /tmp/gate-deps && cd /tmp/gate-deps
          npm init -y >/dev/null
          npm install --no-audit --no-fund yaml@2

      # Structured workflow-graph validation. This is release_workflow_static_policy,
      # NOT runtime release_provenance; the latter needs a relayed provenance
      # artifact validated with --provenance.
      - name: Run release provenance gate (structured DAG)
        env:
          NODE_PATH: /tmp/gate-deps/node_modules
        run: node scripts/org-contract/check-release-provenance.mjs --root scan

  o-attestation:
    name: "O5: exact-tuple attestation (v2)"
    needs: [o0-script-tests, o1-repository-assurance, o2a-canonical-contract, o2b-consumer-compatibility, o3-golden-path-e2e, o4-release-provenance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Clone every pinned non-core repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for repo in $(node scripts/org-contract/stack-lock.mjs --repos); do
            scripts/org-contract/checkout-pinned.sh "$repo" "scan/${repo}"
          done

      - name: Generate exact-tuple attestation (fails on missing ownership)
        run: |
          node scripts/org-contract/generate-attestation.mjs \
            --root scan \
            --out attestations/org-stack-current.json \
            --gate-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}"

      - name: Summarize attestation
        run: cat attestations/org-stack-current.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: org-stack-attestation
          path: attestations/org-stack-current.json
          retention-days: 90
