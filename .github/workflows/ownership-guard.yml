name: Ownership guard + patrol dedupe

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership-guard:
    name: Ownership firewall (OWN-01..04) + patrol dedupe (PATROL-01..04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Determine changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "${BASE}" || BASE=$(git rev-parse HEAD~1)
            git diff --name-only "${BASE}"..HEAD > changed.txt
          else
            git diff --name-only HEAD~1..HEAD > changed.txt || git ls-files > changed.txt
          fi
          echo "count=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"

      - name: Ownership firewall (changed runtime code + archived anchors)
        run: |
          # OWN-01..03 over changed paths; OWN-04 scans content of every
          # changed text file for archived schema anchors.
          python scripts/check-repository-ownership.py \
            --changed $(cat changed.txt) \
            --anchor-content-files $(cat changed.txt)

      - name: Patrol dedupe lifecycle (PATROL-01..04)
        run: python scripts/patrol-dedupe.py --self-test
