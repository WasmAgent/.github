name: Package maturity CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package-maturity:
    name: Validate package maturity registry (MAT-01..04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate + regenerate docs/package-maturity.md
        run: |
          python scripts/generate-package-maturity.py
          python scripts/generate-package-maturity.py --check
