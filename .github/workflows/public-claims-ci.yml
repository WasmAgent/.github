name: Public claims CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-claims:
    name: Validate claims + overreach guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate claims/public-claims.yml + overreach guard
        run: python scripts/validate-public-claims.py
