name: Public claims CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-claims:
    name: Validate claims + overreach guard
    runs-on: ubuntu-latest
    steps:
      # Candidate tree: supplies the DATA (claims, ledgers, public text).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Trust anchor: the VALIDATOR comes from an immutable main revision, so
      # a candidate cannot weaken the required claim check by editing the
      # validator implementation. Upgrading the validator is a deliberate
      # pin bump to the new merged main revision.
      - name: Checkout pinned trusted validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: WasmAgent/.github
          ref: e463cc9cbc108f7ffe47fb7ff67b672f56c41925
          path: .validator
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate claims/public-claims.yml + overreach guard
        run: python .validator/scripts/validate-public-claims.py --repo-root .

      # STALE-PIN REGRESSION (discriminating): a hostile fixture — a
      # perfect-looking self-declared formal_certification record plus an
      # allowlist entry citing it — must be REJECTED by the PINNED validator.
      # Verified empirically: the stale revision 4a5a9126 PASSES this fixture
      # (bypass allowed); b766222d and later reject it via the hard-disable
      # rule. If a future pin bump lands on a stale revision, this step
      # fails and blocks the merge.
      - name: Stale-pin regression (pinned validator must reject fake certification allowlist)
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          cp -r . "$TMP/repo"
          rm -rf "$TMP/repo/.git" "$TMP/repo/.validator"
          python3 - "$TMP/repo" <<'PY'
          import json, os, sys
          repo = sys.argv[1]
          ledger_path = os.path.join(repo, "evidence", "external-validation.json")
          ledger = json.load(open(ledger_path, encoding="utf-8"))
          ledger["records"].append({
              "id": "EXT-FAKE-9999",
              "subject": "AEP",
              "venue": {"org": "Example Body", "repo": "example/repo"},
              "evidence_type": "formal_certification",
              "state": "merged",
              "certifying_body": "Example Certification Body",
              "certificate_id": "FAKE-001",
              "certificate_url": "https://example.org/cert/FAKE-001",
              "scope": "WasmAgent AEP",
              "valid_from": "2026-01-01",
              "claim_ceiling": "x" * 40,
              "prohibited_claims": ["example_forbidden"],
              "anchors": {"cert": "https://example.org/cert/FAKE-001"},
              "limitations": ["fixture"]
          })
          json.dump(ledger, open(ledger_path, "w", encoding="utf-8"), indent=2)
          phrase = "certified by the linux foundation"
          docs = os.path.join(repo, "docs")
          os.makedirs(docs, exist_ok=True)
          with open(os.path.join(docs, "hostile-fixture.md"), "w", encoding="utf-8") as fh:
              fh.write(f"Agentkit is {phrase}.\n")
          allow_path = os.path.join(repo, "claims", "claim-overreach-allowlist.json")
          allow = json.load(open(allow_path, encoding="utf-8"))
          allow["allowlist"] = [
              {"phrase": phrase, "file": "docs/hostile-fixture.md", "approved_evidence": "EXT-FAKE-9999"},
              {"phrase": phrase, "file": "claims/claim-overreach-allowlist.json", "approved_evidence": "EXT-FAKE-9999"},
          ]
          json.dump(allow, open(allow_path, "w", encoding="utf-8"), indent=2)
          PY
          if python .validator/scripts/validate-public-claims.py --repo-root "$TMP/repo" > /tmp/stale-pin.out 2>&1; then
            echo "FAIL: pinned validator ACCEPTED a self-declared certification allowlist entry — pin is STALE (hard-disable missing from the pinned revision)"
            exit 1
          fi
          grep -q "HARD-DISABLED" /tmp/stale-pin.out || {
            echo "FAIL: pinned validator failed for another reason — inspect /tmp/stale-pin.out"; cat /tmp/stale-pin.out; exit 1;
          }
          echo "OK: pinned validator hard-disables certification allowlist entries"

          # ── Second generation (G1 authority, #237): the pinned validator
          # must ALSO enforce the claim-status enum and PC-02a total-count
          # semantics. Fixture: a 7th claim with status `shipped` while the
          # homepage still reads "6 public claims — all `supported`". The
          # pre-G1 pin 19b0883 PASSES this fixture (its supported-count
          # semantics still match: 6 supported == 6 displayed), so a pin
          # regression below #237 turns this step red instead of silently
          # dropping G1 protections. Verified empirically: 19b0883 exits 0
          # on this exact fixture; e463cc9c and later reject it.
          TMP2=$(mktemp -d)
          cp -r . "$TMP2/repo"
          rm -rf "$TMP2/repo/.git" "$TMP2/repo/.validator"
          python3 - "$TMP2/repo" <<'PY'
          import sys
          repo = sys.argv[1]
          p = f"{repo}/claims/public-claims.yml"
          t = open(p, encoding="utf-8").read()
          t += (
              "  - id: WA-C-9900\n"
              "    claim_class: internal_supported\n"
              "    domain: evidence\n"
              "    claim: >-\n"
              "      stale-pin discriminator fixture (not a real claim)\n"
              "    evidence:\n"
              "      repo: wasmagent-protocol\n"
              "    status: shipped\n"
              "    recorded: 2026-09-19\n"
          )
          open(p, "w", encoding="utf-8").write(t)
          PY
          if python .validator/scripts/validate-public-claims.py --repo-root "$TMP2/repo" > /tmp/stale-pin-g1.out 2>&1; then
            echo "FAIL: pinned validator ACCEPTED an unknown claim status with total-count drift — pin is STALE (pre-G1 authority, #237 semantics missing)"
            exit 1
          fi
          grep -q "unknown status 'shipped'" /tmp/stale-pin-g1.out || {
            echo "FAIL: pinned validator failed for another reason — inspect /tmp/stale-pin-g1.out"; cat /tmp/stale-pin-g1.out; exit 1;
          }
          grep -q "claim counter must show 7" /tmp/stale-pin-g1.out || {
            echo "FAIL: pinned validator did not enforce PC-02a total-count — pin is STALE (pre-G1 authority)"; cat /tmp/stale-pin-g1.out; exit 1;
          }
          echo "OK: pinned validator carries G1 authority (status enum + PC-02a/02b)"

          # ── PC-02b independent fixture: exactly one existing claim flips
          # supported -> deprecated (total stays 6, status enum legal,
          # homepage still asserts "all `supported`"). The ONLY acceptable
          # failure is the PC-02b message; a validator missing PC-02b
          # (e.g. one carrying status enum + PC-02a but not 02b) exits 0
          # here, so this grep is the independent tripwire for the third
          # G1 invariant.
          TMP3=$(mktemp -d)
          cp -r . "$TMP3/repo"
          rm -rf "$TMP3/repo/.git" "$TMP3/repo/.validator"
          python3 - "$TMP3/repo" <<'PY'
          import sys
          repo = sys.argv[1]
          p = f"{repo}/claims/public-claims.yml"
          t = open(p, encoding="utf-8").read()
          assert t.count("    status: supported\n") == 6
          t = t.replace("    status: supported\n", "    status: deprecated\n", 1)
          open(p, "w", encoding="utf-8").write(t)
          PY
          if python .validator/scripts/validate-public-claims.py --repo-root "$TMP3/repo" > /tmp/stale-pin-pc02b.out 2>&1; then
            echo "FAIL: pinned validator ACCEPTED 'all \`supported\`' wording with a deprecated claim — PC-02b is MISSING from the pin"
            exit 1
          fi
          grep -q "contains a non-supported claim" /tmp/stale-pin-pc02b.out || {
            echo "FAIL: pinned validator failed for another reason — inspect /tmp/stale-pin-pc02b.out"; cat /tmp/stale-pin-pc02b.out; exit 1;
          }
          echo "OK: pinned validator independently enforces PC-02b"
