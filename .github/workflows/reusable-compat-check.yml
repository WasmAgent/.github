name: Reusable Org Compatibility

# Called by consumer repositories on contract-sensitive pull requests so that
# "local CI PASS, cross-repo compatibility FAIL" cannot be merged (N2-P1-06).
#
# Callers MUST pin this file by immutable SHA:
#   uses: WasmAgent/.github/.github/workflows/reusable-compat-check.yml@<sha>
# The pin is enforced by the consumer's own workflow and by O1 (immutable refs).
#
# This workflow:
#   - checks out the org gate implementation at the pinned workflow SHA,
#   - checks out the caller's candidate revision (asserted against the input),
#   - runs the same canonical-integrity + consumer/E2E checks as O2a/O2b,
#     against the candidate instead of the pinned main.

on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  compat:
    name: "Org compatibility (${{ inputs.repo }})"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout org gate implementation at the pinned workflow SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Reusable-job identity, not the caller-associated `github` context:
          # github.job_workflow_sha resolves empty on cross-repo callers and
          # silently falls back to the default branch (N3-P1-01).
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .org

      - name: Assert org gate checkout matches the reusable workflow SHA
        run: |
          set -euo pipefail
          actual="$(git -C .org rev-parse HEAD)"
          expected="${{ job.workflow_sha }}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::org gate HEAD ${actual} != workflow SHA ${expected}"
            exit 1
          fi

      - name: Checkout candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Assert candidate revision matches the requested SHA
        run: |
          set -euo pipefail
          actual="$(git -C candidate rev-parse HEAD)"
          expected="${{ inputs.candidate_sha }}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::candidate HEAD ${actual} != requested ${expected}"
            exit 1
          fi

      - name: Install gate script dependencies
        run: |
          mkdir -p /tmp/gate-deps && cd /tmp/gate-deps
          npm init -y >/dev/null
          npm install --no-audit --no-fund yaml@2

      - name: Run org compatibility against the candidate
        env:
          NODE_PATH: /tmp/gate-deps/node_modules
        run: |
          node .org/scripts/org-contract/compat-run.mjs \
            --repo "${{ inputs.repo }}" \
            --candidate candidate \
            --org .org

      # Governance self-compatibility must inspect the candidate tree with the
      # trusted O1 scanner, not merely the candidate's own tests (N3-P1-04).
      - name: Trusted O1 assurance scan of the governance candidate
        if: inputs.repo == '.github'
        run: |
          set -euo pipefail
          mkdir -p /tmp/gov-scan
          rm -rf /tmp/gov-scan/.github
          cp -a candidate /tmp/gov-scan/.github
          rm -rf /tmp/gov-scan/.github/.git
          python3 .org/scripts/check-repository-assurance.py --root /tmp/gov-scan --only-repo .github

      - name: Candidate governance unit tests (additive evidence)
        if: inputs.repo == '.github'
        working-directory: candidate
        env:
          NODE_PATH: /tmp/gate-deps/node_modules
        run: node --test scripts/org-contract/*.test.mjs
