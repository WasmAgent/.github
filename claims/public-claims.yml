# WasmAgent public claims registry.
# Each entry maps an org-made claim to its supporting evidence and review
# status. This is a public ledger: edit in place only with merged evidence.
#
# claim_class (enforced by scripts/validate-public-claims.py):
#   internal_supported      org-internal evidence only (default)
#   externally_observed     an external party observed the artifact (ref required)
#   independently_reproduced an external party reproduced published behavior (ref required)
#   formally_certified      a certification body issued a certificate (ref + cert fields required)
# Endorsement/certification wording (the phrases listed in the validator's
# FORBIDDEN_PATTERNS) is blocked by the same validator;
# allowlist: claims/claim-overreach-allowlist.json.
schema_version: 1
org: WasmAgent
